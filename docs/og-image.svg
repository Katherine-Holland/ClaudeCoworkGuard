<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#07090d"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#e05a20" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07090d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Icon — shield shape -->
  <g transform="translate(490, 120)">
    <!-- Shield/heart-pin shape matching the icon -->
    <path d="M110 0 C110 0 220 40 220 120 C220 190 170 230 110 270 C50 230 0 190 0 120 C0 40 110 0 110 0Z" fill="#0e1318" stroke="#1c2a38" stroke-width="2"/>
    <!-- Lock body -->
    <rect x="72" y="118" width="76" height="62" rx="8" fill="#00d4ff"/>
    <!-- Lock shackle -->
    <path d="M88 118 L88 98 C88 76 132 76 132 98 L132 118" fill="none" stroke="#00d4ff" stroke-width="12" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="110" cy="145" r="10" fill="#07090d"/>
    <rect x="105" y="148" width="10" height="16" rx="2" fill="#07090d"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="390" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="300" fill="#e8f0f8" text-anchor="middle" letter-spacing="-2">Cowork<tspan font-weight="700" fill="#f07040">Guard</tspan></text>

  <!-- Tagline -->
  <text x="600" y="450" font-family="'DM Mono', 'Courier New', monospace" font-size="22" fill="#4e6278" text-anchor="middle" letter-spacing="2">LOCAL AI AGENT FIREWALL</text>

  <!-- Bottom detail line -->
  <line x1="440" y1="490" x2="760" y2="490" stroke="#1c2a38" stroke-width="1"/>
  <text x="600" y="520" font-family="'DM Mono', 'Courier New', monospace" font-size="16" fill="#2a3d50" text-anchor="middle" letter-spacing="1">coworkguard.com</text>
</svg>
