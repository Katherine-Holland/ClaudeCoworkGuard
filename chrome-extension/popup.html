<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CoworkGuard</title>
<style>
:root {
  --bg: #ffffff;
  --bg2: #f8fafc;
  --border: rgba(15,23,42,.08);
  --blue: #0a84ff;
  --blue2: #2563eb;
  --ink: #0f172a;
  --muted: #5f6b7a;
  --soft: #94a3b8;
  --green: #22c55e;
  --amber: #f59e0b;
  --red: #ef4444;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 320px;
  min-height: 200px;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.logo {
  display: flex;
  align-items: center;
  gap: 9px;
}
.logo-mark {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: linear-gradient(145deg, #ffffff, #eaf2ff);
  box-shadow: inset 0 0 0 1px rgba(10,132,255,.18);
  display: grid;
  place-items: center;
  color: var(--blue2);
  flex-shrink: 0;
}
.logo-mark svg { width: 16px; height: 16px; }
.logo-name {
  font-size: 14px;
  font-weight: 650;
  color: var(--ink);
  letter-spacing: -.3px;
}

/* Status pill */
.pill {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 100px;
  font-size: 10px;
  font-family: var(--mono);
  font-weight: 600;
  border: 1px solid;
  letter-spacing: .04em;
}
.pill.active   { background: rgba(34,197,94,.08);  border-color: rgba(34,197,94,.25);  color: #166534; }
.pill.partial  { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.25); color: #92400e; }
.pill.inactive { background: rgba(148,163,184,.1); border-color: rgba(148,163,184,.3); color: var(--muted); }
.dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.pill.active .dot { animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

/* Partial banner */
.partial-banner {
  background: rgba(245,158,11,.06);
  border-bottom: 1px solid rgba(245,158,11,.15);
  padding: 12px 16px;
  font-size: 12px;
  color: #78350f;
  display: none;
  line-height: 1.5;
}
.partial-banner p { margin-bottom: 10px; color: var(--muted); font-size: 12px; }
.install-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--blue2);
  color: white;
  text-decoration: none;
  font-size: 12px;
  font-weight: 600;
  padding: 7px 14px;
  border-radius: 8px;
  cursor: pointer;
}
.install-btn:hover { opacity: .88; }

/* Stats */
.stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.stat {
  padding: 10px 6px;
  text-align: center;
  border-right: 1px solid var(--border);
}
.stat:last-child { border-right: none; }
.stat-v {
  font-size: 18px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 3px;
  letter-spacing: -.03em;
}
.stat-v.blocked { color: var(--red); }
.stat-v.flagged { color: var(--amber); }
.stat-v.clean   { color: var(--green); }
.stat-v.local   { color: var(--blue); }
.stat-v.wrap    { color: var(--muted); }
.stat-l {
  font-size: 9px;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--soft);
}

/* Events */
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px 4px;
}
.section-title {
  font-size: 10px;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--soft);
}
.tab-toggle {
  font-size: 10px;
  font-family: var(--mono);
  color: var(--blue2);
  cursor: pointer;
  letter-spacing: .06em;
  font-weight: 600;
}
.event-list { max-height: 140px; overflow-y: auto; }
.event-list::-webkit-scrollbar { width: 3px; }
.event-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.event-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
}
.event-item:last-child { border-bottom: none; }
.badge {
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 700;
  font-family: var(--mono);
  white-space: nowrap;
  letter-spacing: .03em;
}
.badge.BLOCKED { background: rgba(239,68,68,.1);  color: var(--red);   border: 1px solid rgba(239,68,68,.2); }
.badge.FLAGGED { background: rgba(245,158,11,.1); color: #b45309;      border: 1px solid rgba(245,158,11,.2); }
.badge.CLEAN   { background: rgba(34,197,94,.08); color: #166534;      border: 1px solid rgba(34,197,94,.2); }
.badge.NO_PROXY{ background: rgba(148,163,184,.1);color: var(--muted); border: 1px solid var(--border); }
.badge.WARNING { background: rgba(10,132,255,.08);color: var(--blue2); border: 1px solid rgba(10,132,255,.2); }
.event-detail {
  color: var(--muted);
  font-size: 11px;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.event-time { font-size: 10px; color: var(--soft); font-family: var(--mono); flex-shrink: 0; }
.empty {
  padding: 20px 14px;
  text-align: center;
  color: var(--soft);
  font-size: 11px;
  font-family: var(--mono);
}

/* Skill alert */
.skill-alert {
  display: none;
  background: rgba(239,68,68,.04);
  border-bottom: 1px solid rgba(239,68,68,.12);
  padding: 8px 14px;
  font-size: 11px;
}
.skill-alert-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Footer */
.footer {
  display: flex;
  gap: 8px;
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  background: var(--bg2);
}
.footer-btn {
  flex: 1;
  padding: 8px;
  border-radius: 8px;
  font-size: 11px;
  font-family: var(--font);
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--muted);
  transition: all .15s;
  text-align: center;
}
.footer-btn:hover { border-color: var(--blue2); color: var(--blue2); }
.footer-btn.primary {
  border-color: rgba(10,132,255,.25);
  color: var(--blue2);
  background: rgba(10,132,255,.06);
}
.footer-btn.primary:hover { background: rgba(10,132,255,.12); }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M32 5 54 14v17c0 17-11.5 25-22 29C21.5 56 10 48 10 31V14L32 5Z" stroke="currentColor" stroke-width="5"/>
        <path d="M32 18 43 23v12c0 8-5.5 13-11 15-5.5-2-11-7-11-15V23l11-5Z" fill="currentColor"/>
      </svg>
    </div>
    <div class="logo-name">CoworkGuard</div>
  </div>
  <div class="pill inactive" id="status-pill">
    <div class="dot"></div>
    <span id="status-text">CHECKING</span>
  </div>
</div>

<!-- Partial protection banner -->
<div class="partial-banner" id="partial-banner">
  <p>Payload scanning is off. The CoworkGuard app is not running.</p>
  <a class="install-btn"
     href="https://coworkguard.com"
     target="_blank"
     rel="noopener noreferrer">
    ↓ &nbsp;Finish Installation
  </a>
</div>

<!-- Stats -->
<div class="stats">
  <div class="stat"><div class="stat-v blocked" id="s-blocked">0</div><div class="stat-l">Blocked</div></div>
  <div class="stat"><div class="stat-v flagged" id="s-flagged">0</div><div class="stat-l">Flagged</div></div>
  <div class="stat"><div class="stat-v clean"   id="s-clean">0</div><div class="stat-l">Clean</div></div>
  <div class="stat"><div class="stat-v local"   id="s-local">0</div><div class="stat-l">Local AI</div></div>
  <div class="stat"><div class="stat-v wrap"    id="s-wrap">0</div><div class="stat-l">Wrap</div></div>
</div>

<!-- Skill alert -->
<div class="skill-alert" id="skill-alert">
  <div class="skill-alert-inner">
    <span style="color:var(--red);font-weight:600;" id="skill-alert-text">Skill scanner findings</span>
    <span style="color:var(--blue2);cursor:pointer;font-size:10px;font-family:var(--mono);" id="btn-show-skills">View →</span>
  </div>
</div>

<!-- Events -->
<div class="section-head">
  <span class="section-title">Recent Events</span>
  <span class="tab-toggle" id="tab-toggle">SKILLS</span>
</div>
<div class="event-list" id="event-list">
  <div class="empty">No events yet</div>
</div>
<div class="event-list" id="skill-list" style="display:none">
  <div class="empty">No skill scans yet</div>
</div>

<!-- Footer -->
<div class="footer">
  <button class="footer-btn primary" id="btn-dashboard">Open Dashboard</button>
  <button class="footer-btn" id="btn-skills">Skills</button>
  <button class="footer-btn" id="btn-clear">Clear</button>
</div>

<script src="popup.js"></script>
</body>
</html>
